:root{--brand:#b04a17;--brand-d:#8f3a10;--soft:#fdf0e4;--ink:#25282b;--sub:#575d62;--line:#e6e3de;--bg:#f6f5f2;--card:#fff;--ok:#2e7d4f;--ok-bg:#e4f3ea;--warn:#a5301f;--warn-bg:#fde8e4;--info:#2f5fb3;--info-bg:#e8effc;--r:14px}
